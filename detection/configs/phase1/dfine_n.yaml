__include__: [../dfine_n.yaml]

epochs: 100
eval_spatial_size: [704, 704]
# The runner loads the full checkpoint with tuning; skip a separate backbone download.
HGNetv2:
  pretrained: false

# Adapt the inherited long COCO schedule to 100 epochs.
lr_scheduler:
  milestones: [80]
lr_warmup_scheduler:
  warmup_duration: 100

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [704, 704]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
      policy:
        epoch: 88
  collate_fn:
    base_size: 704
    base_size_repeat: null
    stop_epoch: 88

val_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [704, 704]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
