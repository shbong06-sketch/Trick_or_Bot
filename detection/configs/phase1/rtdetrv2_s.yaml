__include__: [../rtdetrv2_s.yaml]

epoches: 100
eval_spatial_size: [704, 704]
# PResNet.pretrained=false is inherited: the runner loads the full detector checkpoint.
lr_scheduler:
  milestones: [80]
lr_warmup_scheduler:
  warmup_duration: 100

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [704, 704]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
      policy:
        epoch: 88
  collate_fn:
    scales: null
    stop_epoch: 88

val_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [704, 704]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
