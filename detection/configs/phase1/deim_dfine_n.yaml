__include__: [../deim_dfine_n.yaml]

epoches: 100
eval_spatial_size: [704, 704]
# The runner loads the full checkpoint with tuning; skip a separate backbone download.
HGNetv2:
  pretrained: false

flat_epoch: 44
no_aug_epoch: 12
warmup_iter: 100

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 352, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: false, max_cached_images: 50, random_pop: true}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [704, 704]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
      policy:
        epoch: [4, 44, 88]
  collate_fn:
    base_size: 704
    base_size_repeat: null
    mixup_epochs: [4, 44]
    stop_epoch: 88

val_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [704, 704]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
