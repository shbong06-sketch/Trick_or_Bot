__include__:
  - /opt/rtdetr/rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r18vd_120e_coco.yml

num_classes: 1
remap_mscoco_category: false
output_dir: /workspace/experiments/rtdetrv2/rtdetrv2_s

# The full detector checkpoint is loaded with -t; no separate backbone download.
PResNet:
  pretrained: false

train_dataloader:
  total_batch_size: 8
  num_workers: 2
  dataset:
    img_folder: /workspace/dataset/images/train
    ann_file: /workspace/dataset/annotations/instances_train.json

val_dataloader:
  total_batch_size: 8
  num_workers: 2
  dataset:
    img_folder: /workspace/dataset/images/valid
    ann_file: /workspace/dataset/annotations/instances_valid.json
