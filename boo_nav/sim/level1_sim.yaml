# boo_nav 시험용 레벨 파일(Gazebo 월드 생성·AMCL 초기 위치용). 팀 backend/config/level1.yaml과 별개다.
# 지도: backend/maps/holloween_boo.yaml (술래용 지도). 좌표는 이 지도의 map 좌표계다.
# boo_start: 옛 시뮬레이션 화면(2026-10-10 16:44)에서 사용자가 흰색 사각형으로 표시한 자리(아래 벽 쪽, 도크 위치)에 해당하는
#   holloween_boo 지도 위치. 아래 벽(자유 칸 끝 y=-3.80)에서 0.5 m 위, 벽까지 거리 0.5 m, 위(+y)를 향한다.
# 사탕·탈출문 표식은 넣지 않는다(아직 구현 대상이 아님).
lv: 1
name: Boo Nav2 시험용(holloween_boo 지도)
map_yaml: ../../backend/maps/holloween_boo.yaml
boo_start:
  x: -3.05
  y: -3.3
  yaw: 1.5708
pumpkin_start:
  x: -2.5
  y: 1.25
  yaw: -1.5708
