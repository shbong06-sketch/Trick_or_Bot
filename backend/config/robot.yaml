# 펌킨 로봇(/robot2) 설정
pumpkin:
  cmd_request_topic: /tob/pumpkin/cmd_request   # pumpkin_controller 입력. 로봇 cmd_vel 연결은 ros2_ws tob_bringup/config/robots.yaml
  max_lin: 0.2                       # m/s, 요구사항 상한
  max_ang: 1.0                       # rad/s, 회전 속도 (체감 보고 조정)
  cmd_rate_hz: 10                    # 키를 누르고 있는 동안 이동 요청 발행 주기
  watchdog_s: 0.5                    # 입력이 이만큼 끊기면 정지

  image_topic: /robot2/oakd/rgb/image_raw/compressed   # 1인칭 영상 (best effort, depth 1로 구독)
  camera_info_topic: ""              # [확인 필요] 예: /robot2/oakd/rgb/camera_info (비우면 camera_placeholder 사용)
  tf_topic: /robot2/tf               # [확인 필요] 네임스페이스 TF가 아니면 /tf
  tf_static_topic: /robot2/tf_static # [확인 필요] 네임스페이스 TF가 아니면 /tf_static
  map_frame: map
  base_frame: base_link              # [확인 필요] 위치·획득 판정 기준 프레임
  camera_frame: ""                   # 비우면 영상 header.frame_id 사용 [확인 필요]
  tf_timeout_s: 0.05                 # 영상 시각의 TF가 아직 안 왔으면 이만큼만 기다린다

# 부우 로봇(/robot1): 게임 서버는 위치만 읽는다 (조작·순찰은 부우 쪽 노드 담당)
boo:
  tf_topic: /robot1/tf               # [확인 필요]
  tf_static_topic: /robot1/tf_static # [확인 필요]
  map_frame: map
  base_frame: base_link              # [확인 필요]
  mock_speed: 0.2                    # mock 부우 순찰 속도 (m/s)

# 카메라 내부 파라미터 자리표시 값. camera_info 구독은 이후 단계 [확인 필요]
# 704×704는 팀원 기억 기준, fx/fy는 임의 값
camera_placeholder:
  w: 704
  h: 704
  fx: 500.0
  fy: 500.0
  cx: 352.0
  cy: 352.0
  frame: "[확인 필요]"
