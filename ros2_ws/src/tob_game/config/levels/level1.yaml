# [역할]
# 레벨 1의 게임 규칙과 지도 배치를 관리하는 공통 설정이다.
# 게임 관리 노드가 읽으며, 백엔드는 향후 이 파일을 읽도록 연결해야 한다.
# 2026-10-11 사용자 지시에 따라 backend/config/level1.yaml의 배치와
# gate_enter_r=0.3을 복사했다. 백엔드 원본은 유지했다.
# 게임 판정은 게임 관리 노드만 수행한다.
#
# [사용 관계]
# 게임 매니저 담당:
#   설정 로딩과 최종 게임 판정을 구현한다.
# 주은: Pumpkin 조작과 이동 제어. 원호: Boo FSM과 Nav2 목표 관리.
# 인식·위치 계산 담당:
#   감지 여부와 해당 관측에 연결된 유효한 지도 위치·거리를 전달한다.
#   사탕 획득, 피격, 성공·실패를 별도로 판정하지 않는다.
# 성은·민서:
#   백엔드가 전달한 레벨 배치와 GameState로 화면을 구성한다.
#   화면에서 하트·사탕·결과를 독립적으로 판정하지 않는다.
#
# [범위]
# 제한시간, 하트, 사탕 획득, 잡힘 조건, 탈출존을 정의한다.
# 순찰 경로, Nav2, 카메라, 안전 정지 설정은 각 담당 설정에 둔다.
# 레벨 1은 웹캠, 깊이 기반 위치 추정, 자동 복귀를 사용하지 않는다.
#
# [완료 기준]
# 실제 지도에서 시작 위치·사탕·탈출존을 확인한다.
# 복사한 탈출존 반경과 확정한 잡힘 규칙을 실제 주행에서 확인한다.
# 로더는 미설정 값, 유한하지 않은 좌표, 중복 사탕 id,
# 빈 사탕 목록, 잘못된 시간·반경·하트 값을 거절한다.
# 설정이 유효하지 않으면 게임 시작 요청을 거절한다.
# 이 검증은 YAML 자체가 아니라 로더와 game_manager에서 구현한다.
#
# [파일 형식]
# 일반 YAML 설정이다. ROS의 ros__parameters 형식이 아니다.
# game_manager는 레벨 파일 경로를 받아 이 구조를 읽도록 구현한다.
# 백엔드도 이 구조를 읽고 기존 웹 응답 형식으로 변환한다.
# 같은 컴퓨터에서는 같은 파일을 읽도록 연결한다.
# 다른 컴퓨터에서는 경로 설정만으로 파일이 공유되지 않는다.
# 같은 Git 커밋의 설정을 배포하고 실행 중 임의로 따로 수정하지 않는다.
# 레벨 설정은 라운드 시작 전에 읽고 진행 중 변경하지 않는다.
#
# [기존 backend/config 레벨 YAML 수정 안내]
#
# 1. 아래 게임 설정은 이 파일로 옮긴다.
#    기존 키                     -> 이 파일의 키
#    lv                          -> level
#    name                        -> name
#    time_limit_s                -> rules.time_limit_s
#    hearts                      -> rules.initial_hp
#    pick_radius_m               -> rules.candy.pickup_radius_m
#    pumpkin_start.x/y/yaw        -> layout.start_poses.pumpkin.x/y/yaw_rad
#    boo_start.x/y/yaw            -> layout.start_poses.boo.x/y/yaw_rad
#    candies[].id                -> layout.candies[].id
#    candies[].x/y               -> layout.candies[].position.x/y
#    gate.x/y                    -> layout.exit_zone.position.x/y
#
# 2. 백엔드 전용 setting은 backend/config에 남긴다.
#    video_fps: 15
#      영상 중계에 사용하는 설정이다.
#    heartbeat_radius_m: 2.0
#      두근두근 효과용으로 사용한다면 웹 설정으로 유지한다.
#      잡힘 거리나 안전 정지 거리로 사용하지 않는다.
#      실제 효과 기준은 웹 담당자가 확인한다.
#    cctv: []
#      레벨 1의 CCTV 화면 구성이다.
#    map_yaml: ../maps/holloween.yaml
#      기존 백엔드 설정 파일 기준의 지도 경로이다.
#      파일 위치를 바꾸면 상대 경로도 다시 확인한다.
#      ROS와 웹은 동일한 지도 내용과 map 좌표계를 사용한다.
#
# 3. 백엔드에 공통 레벨 파일 경로 설정을 추가한다.
#    제안 키: level_config_path
#    백엔드 로더에서 이 키를 읽는 코드를 함께 구현해야 한다.
#    절대 경로를 쓰거나, 상대 경로를 설정 파일의 부모 폴더 기준으로
#    해석하도록 구현한다. 실행 터미널의 현재 폴더에 의존하지 않는다.
#
# 4. 백엔드 로더와 웹 전달 형식을 수정한다.
#    위 키 대응표대로 읽고, 필요하면 기존 웹 키로 변환한다.
#    사탕 id는 c1/c2/c3를 유지하여 GameState의 획득 id와 연결한다.
#    사탕 위치, 획득 반경, 탈출존 위치·반경은 레벨 배치로 전달한다.
#    현재 하트·시간·획득 id·탈출 가능 여부·결과는 GameState로 전달한다.
#    GameEvent는 효과음과 안내용으로 사용한다.
#    사건 수신 횟수만으로 하트나 사탕 수를 계산하지 않는다.
#
# 5. 기존 탈출문 대기 규칙을 제거한다.
#    gate_dwell_s, gate_front_m, gate_zone_r는 삭제한다.
#    gate_enter_r의 현재 0.3m를 사용자 지시로 새 탈출존 반경에 복사했다.
#    문 대기 로직은 옮기지 않으며 반경의 실제 주행 검증은 별도로 필요하다.
#    gate.yaw는 문 그림 방향에 필요하면 웹 표시 설정에 남긴다.
#    문 앞 대기 타이머, 문 열림 판정, 열린 뒤 진입 판정 코드를 제거한다.
#    웹은 GameState.exit_enabled로 탈출 가능 상태를 표시한다.
#    성공 여부는 GameState.phase의 CLEARED를 따른다.
#
# 6. 기존 백엔드의 게임 판정을 ROS 결과 수신으로 바꾼다.
#    실제 로봇 모드에서 사탕 획득, 피격, 시간 초과,
#    탈출 성공을 백엔드가 별도로 확정하지 않도록 수정한다.
#    START/PAUSE/RESUME/RESET은 GameCommand 서비스로 요청한다.
#    최종 결과 저장은 round_id 기준으로 중복을 방지한다.
#    mock 모드를 유지하면 실제 로봇 모드와 구분하고,
#    mock 판정이 실제 라운드 상태를 덮어쓰지 않도록 한다.
#
# 7. boo_patrol은 부 제어 노드의 설정으로 옮긴다.
#    기존 (0.00, 2.45), (3.00, 2.45)는 자리표시 값이었다.
#    실제 지도의 이동 가능한 경로인지 확인한 뒤 사용한다.
#
# 8. 기존 tools/pick_candies.py도 수정한다.
#    새 공통 레벨 파일의 layout.candies를 갱신하도록 한다.
#    탈출존 지정 기능은 layout.exit_zone.position을 갱신한다.
#    문 방향 지정 기능을 유지하면 방향은 웹 표시 설정에 저장한다.
#    이전 backend/config의 사탕 좌표만 갱신하는 방식은 종료한다.
#
# 9. 수정 순서
#    이 파일 작성 -> ROS/백엔드 로더 연결 -> 웹 형식 변환과 판정 수정
#    -> 동작 확인 -> 기존 backend/config의 중복 게임 설정 삭제.
#    기존 로더를 수정하기 전에 기존 설정부터 삭제하지 않는다.

level: 1
name: "첫 번째 밤"
frame_id: map

rules:
  # 기존 백엔드 값 유지. 240초 = 4분.
  # RUNNING 상태에서만 진행시간을 누적한다.
  time_limit_s: 240.0

  # 기존 백엔드 값 유지.
  # 시작 시 GameState.hp와 max_hp를 모두 이 값으로 설정한다.
  initial_hp: 3

  candy:
    # 기존 pick_radius_m 값 유지. 모든 사탕에 공통 적용한다.
    # 펌킨의 유효한 지도 위치와 사탕 중심 사이의 평면 거리로 판정한다.
    # 거리 <= pickup_radius_m이면 획득한다.
    # 같은 id는 라운드마다 한 번만 획득할 수 있다.
    pickup_radius_m: 0.3

  capture:
    # 아래 숫자는 2026-10-11 사용자가 운영 규칙으로 확정했다.
    # 실제 주행에서 거리와 반응을 검증하는 작업은 별도로 필요하다.
    #
    # 최신 관측의 detected와 map_valid가 모두 참이어야 한다.
    # 관측·위치의 만료시간과 시각 차이 제한은 해당 노드 설정에서 관리한다.
    # 지도 위치 두 개만으로 숨은 펌킨을 잡혔다고 판정하지 않는다.
    #
    # 유효한 관측의 distance_m <= distance_m 조건을 사용한다.
    # 두 로봇의 지도 위치 기준점 사이 평면 거리이며 표면 간 거리가 아니다.
    distance_m: 0.5

    # 조건이 연속으로 유지되어야 하는 시간.
    # RUNNING 중 미감지·위치 무효·관측 만료·거리 초과 시 누적을 초기화한다.
    # PAUSED에서는 누적시간을 동결한다.
    # 재개 후에는 새 유효 관측으로 조건을 다시 검사한다.
    hold_s: 2.0

    # 피격 한 번에 차감할 하트. 하트는 0보다 작아지지 않는다.
    damage_hp: 1

    # 피격 직후 잡힘 누적을 초기화하고 이 기간에는 추가 피격을 막는다.
    # 기간이 끝난 뒤 hold_s를 새로 누적한다.
    # PAUSED에서는 이 기간의 시간도 진행하지 않는다.
    cooldown_s: 3.0

  # 같은 판정 주기에 시간 초과/하트 소진과 탈출 성공이 함께 성립하면
  # 실패를 우선한다. 2026-10-11 사용자가 확정한 운영 규칙이다.
  simultaneous_result_priority: failed

# [고정 게임 규칙]
# 모든 사탕을 획득하면 GameState.exit_enabled를 참으로 설정한다.
# 탈출 가능 상태에서 펌킨이 탈출존 안에 있으면 즉시 CLEARED이다.
# 마지막 사탕 획득 시 이미 탈출존 안에 있어도 즉시 성공할 수 있다.
# 탈출존에 다시 들어오는 동작이나 문 앞 대기시간은 요구하지 않는다.
# 하트가 0이 되거나 제한시간에 도달하면 FAILED이다.
# PAUSED에서는 획득·피격·성공·실패 판정과 게임 시간 진행을 멈춘다.
# 고정 규칙은 game_manager에서 구현하며 불필요한 선택 스위치는 두지 않는다.

layout:
  # backend/config/level1.yaml에서 복사했다. 실제 지도 정렬·주행 검증은 별도이다.
  # x/y 단위는 미터, yaw_rad 단위는 라디안이다.
  #
  # 설정을 읽는 것만으로 실제 로봇이 이동하거나 AMCL이 초기화되지는 않는다.
  # 시작 위치 확인, mock 초기화, AMCL 초기화는 각 코드에서 명시적으로 처리한다.
  # 레벨 1은 실제 로봇의 자동 복귀를 구현하지 않는다.
  start_poses:
    pumpkin:
      x: -0.7
      y: 3.0
      yaw_rad: 1.57

    # 백엔드의 boo_start 값을 복사했다. 로봇을 이 위치로 자동 이동시키지 않는다.
    boo:
      x: -3.5
      y: -1.85
      yaw_rad: 0.00

  # 백엔드의 사탕 id와 좌표를 복사했다.
  # 전체 사탕 수는 이 목록의 길이로 계산한다.
  # 별도의 candy_total 설정은 두지 않는다.
  # GameState.candy_total과 collected_candy_ids가 이 목록에 대응해야 한다.
  candies:
    - id: c1
      position: {x: -3.55, y: 3.22}
    - id: c2
      position: {x: -1.0, y: 0.0}
    - id: c3
      position: {x: -2.47, y: -1.75}

  # 기존 gate 위치를 원형 탈출존 중심으로 사용한다.
  # 펌킨 위치와 중심 사이 평면 거리 <= radius_m이면 탈출존 안이다.
  exit_zone:
    position:
      x: -4.5
      y: -1.8

    # 사용자 지시로 백엔드 gate_enter_r=0.3을 복사했다.
    # 값이 다시 null이 되면 로더와 START는 설정 미완성으로 거절한다.
    radius_m: 0.3
