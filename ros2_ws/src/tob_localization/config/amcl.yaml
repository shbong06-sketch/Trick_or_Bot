# [역할]
# 로봇 자신의 지도상 위치를 추정하는 AMCL 설정.
# [작성할 항목]
# 레이저 입력, 지도·오도메트리·로봇 프레임, 필요한 AMCL 파라미터.
# [작성 기준]
# 설치된 Jazzy용 AMCL/TurtleBot 구성에서 필요한 항목을 가져와 조정한다.
# 두 로봇의 네임스페이스와 TF 연결 방식을 반영한다.
# [범위]
# 모든 AMCL 파라미터를 임의로 재설계하거나 실제 확인 없이 튜닝하지 않는다.
# [완료 기준]
# 각 로봇이 자신의 센서와 TF를 사용해 공통 지도에서 위치추정을 수행한다.
