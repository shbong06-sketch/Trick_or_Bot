# Boo 이동 제어 설정 (boo_controller_node). 단위는 항목 끝에 적었다.
# 코드에서 실제 읽는 항목만 둔다. 게임 난이도는 레벨 YAML, 최종 안전 상한은 safety.yaml,
# Nav2 속도 한계는 nav2.yaml이 원본이다. 같은 값을 여기에 중복해서 두지 않는다.
#
# 노드 이름(boo_controller)이나 네임스페이스(/robot1)가 바뀌어도 읽히도록 /** 를 쓴다.
/**:
  boo_controller:
    ros__parameters:
      control_period_s: 0.1        # 제어 주기 [s]
      obs_timeout_s: 0.5           # 관측 유효 시간 [s]. 지나면 보이지 않는 것으로 본다
      game_timeout_s: 2.0          # GameState 유효 시간 [s]. 지나면 이동하지 않는다
      accepted_sources: ["boo_camera"]   # 추격에 쓰는 관측 출처
      frame_id: "map"
      nav2_action: "navigate_to_pose"    # 노드 네임스페이스 기준 액션 이름

      # --- 목표 갱신 ---
      goal_update_dist_m: 0.2      # 목표가 이만큼 움직여야 새 목표를 보낸다 [m]
      goal_min_interval_s: 0.5     # 새 목표를 보내는 최소 간격 [s]
      chase_standoff_m: 0.45       # 추격 중 경로상 남은 거리가 이 값 이하면 멈춘다 [m]
                                   # (잡힘 거리 0.5 m 중심 간, 안전 정지 0.64 m보다 안쪽 [확인])

      # --- 게임·안전 상태 확인 ---
      # true이면 해당 메시지가 없거나 만료되면 이동하지 않는다(실제 운용 기본).
      # 로봇 한 대만 놓고 시험할 때만 false로 바꾼다.
      require_game_state: true
      require_safety: true

      # --- 순찰 지점 [x1, y1, x2, y2, ...] (map 좌표 [m]) ---
      # 임시값: 시뮬레이션 월드(옛 지도 좌표계)에서 빈 공간으로 확인한 두 점. 새 지도 확정(좌표계 정렬) 후 바꿔야 한다 [확인]
      patrol_points_xy: [1.0, 2.5, 2.5, 2.5]

      # --- 행동 전환 (Lv1 기준. 수색은 Lv1에 없으므로 search_hold_s=0) ---
      suspicion_fill_s: 3.0        # 계속 보일 때 의심 게이지 0 → 1 [s] (SRD 부록 A Lv1)
      suspicion_decay_s: 3.0       # 안 보일 때 1 → 0 [s]
      lost_timeout_s: 1.0          # 추격 중 이 시간 못 보면 수색 [s]
      search_hold_s: 0.0           # 수색 지점에서 머무는 시간 [s]
      search_timeout_s: 15.0       # 수색 지점까지 가는 최대 시간 [s]
      max_goal_failures: 3         # 순찰 목표가 연속 실패하면 멈추는 횟수
      suspect_hold: true           # 의심 중 멈춰서 관찰
