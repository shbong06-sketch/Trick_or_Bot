# TrickOrBot 구현 지침 v2
# [공통 구현 원칙]
# - 아래 내용은 구현할 기능의 설명이며, 현재 기능이 구현되어 있다는 뜻은 아니다.
# - ROS 2 Jazzy와 현재 패키지 구조를 기준으로 최소한의 구현을 작성한다.
# - docs/interfaces.md와 관련 .msg/.srv 파일을 확인하고 공통 규격을 따른다.
# - 필수 규격이나 게임 규칙이 미정이면 필요한 결정 사항을 먼저 명시한다.
# - 미정인 값을 실제 장비에서 확인한 값처럼 사용하지 않는다.
# - 기존 ROS/Nav2 기능과 공통 모듈을 재사용하고 같은 기능을 중복 구현하지 않는다.
# - 요청하지 않은 패키지, 외부 서버, DB, 플러그인 구조는 추가하지 않는다.
# - 단순한 기능을 불필요한 클래스 계층이나 여러 보조 파일로 나누지 않는다.
# - 필요한 입력 검사와 안전 처리는 구현하되 자동 복구 기능을 임의로 확대하지 않는다.
# - 이 파일의 완료 기준을 만족하면 추가 기능 구현을 멈춘다.
#
# [역할]
# 이동 요청과 행동 실행에 필요한 제어 설정.
# [작성할 항목]
# 제어 주기, 추격 목표 갱신 기준, 복귀 기능 활성 여부.
# [작성 기준]
# 코드에서 실제 읽는 항목만 정의하고 단위를 명시한다.
# 목표를 불필요하게 반복 전송하지 않도록 필요한 기준만 둔다.
# [범위]
# 게임 난이도는 레벨 YAML, 최종 안전 상한은 safety.yaml에서 관리한다.
# 같은 값의 서로 다른 원본을 만들지 않는다.
# [완료 기준]
# 필요한 동작을 설정으로 조정할 수 있고 중복된 기준값이 없다.

# 펌킨 조작 연동 (tob_control/pumpkin_controller_node.py)
# 실행: ros2 run tob_control pumpkin_controller --ros-args --params-file <이 파일>
pumpkin_controller:
  ros__parameters:
    game_state_timeout_s: 1.0    # GameState를 이만큼 못 받으면 조작 중지 (game_manager state_period_s 0.1초 기준) [조정 필요]
    request_max_age_s: 0.5       # 만든 지 이만큼 지난 이동 요청은 넘기지 않는다
    check_rate_hz: 10.0          # 게임 상태 만료 검사 주기
