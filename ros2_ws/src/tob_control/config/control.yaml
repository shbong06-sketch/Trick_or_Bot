# Boo 이동 제어 설정 (boo_controller_node). 단위는 항목 끝에 적었다.
# 코드에서 실제 읽는 항목만 둔다. 게임 난이도는 레벨 YAML, 최종 안전 상한은 safety.yaml,
# Nav2 속도 한계는 nav2.yaml이 원본이다. 같은 값을 여기에 중복해서 두지 않는다.
#
# 노드 이름(boo_controller)이나 네임스페이스(/robot1)가 바뀌어도 읽히도록 /** 를 쓴다.
/**:
  boo_controller:
    ros__parameters:
      control_period_s: 0.1        # 제어 주기 [s]. 이 간격마다 관측을 확인하고 상태를 바꾸고 BooState를 발행한다
      obs_timeout_s: 0.5           # 관측 유효 시간 [s]. 이 시간 안에 새 관측이 없으면 "보이지 않는다"로 본다
                                   # (탐지 노드가 보통 10 Hz로 발행하므로 몇 번 빠져도 견디는 값. 늘리면 오래된 위치로 추격할 위험이 커진다)
      game_timeout_s: 2.0          # GameState 유효 시간 [s]. 이 시간 안에 게임 상태를 못 받으면 이동하지 않는다
      accepted_sources: ["boo_camera"]   # 추격에 쓰는 관측 출처. 웹캠(cctv) 같은 다른 출처는 무시한다
      frame_id: "map"              # 목표·관측 좌표의 기준 프레임. 지도(map) 좌표만 쓴다
      nav2_action: "navigate_to_pose"    # Nav2 이동 액션 이름. 노드 네임스페이스(/robot1)가 앞에 붙는다

      # --- 목표 갱신 ---
      # 추격 중 펌킨이 움직일 때마다 목표를 새로 보내면 Nav2가 계속 경로를 다시 짜서 로봇이 떨리므로, 아래 두 값으로 거른다.
      goal_update_dist_m: 0.2      # 목표가 이만큼 움직여야 새 목표를 보낸다 [m]
      goal_min_interval_s: 0.5     # 새 목표를 보내는 최소 간격 [s]
      chase_standoff_m: 0.45       # 추격 정지 거리 [m]: 경로상 남은 거리가 이 값 이하면 목표를 취소하고 그 자리에서 기다린다.
                                   # 크게 하면 펌킨과 멀리서 멈추고, 작게 하면 가까이 붙다가 시야각(69°) 밖으로 벗어나 놓칠 수 있다.
                                   # 펌킨 상단 판이 카메라에 어느 정도 보이는 거리가 하한이다(사용자 확인 2026-10-10).
                                   # (잡힘 거리 0.5 m 중심 간, 안전 정지 0.64 m와의 관계는 팀과 정해야 한다 [확인])

      # --- 게임·안전 상태 확인 ---
      # true이면 해당 메시지가 없거나 만료되면 이동하지 않는다(실제 운용 기본).
      # 로봇 한 대만 놓고 시험할 때만 false로 바꾼다(boo_nav/config/control_sim.yaml, control_real.yaml이 그렇게 한다).
      require_game_state: true     # GameState(/tob/game/state)가 RUNNING일 때만 이동
      require_safety: true         # SafetyState(/tob/boo/safety)의 motion_allowed가 참일 때만 이동

      # --- 순찰 지점 [x1, y1, x2, y2, ...] (map 좌표 [m]) ---
      # 임시값: holloween_boo 지도(술래용)에서 벽까지 0.5 m 이상 떨어진 빈 공간 두 점. 실제 순찰 지점은 확정 후 바꾼다 [확인]
      # 지점을 순서대로 돌고 마지막 다음에는 처음으로 돌아간다. 점이 2개면 두 점 사이를 왕복한다. 단위 [m], map 좌표.
      patrol_points_xy: [-3.0, -3.25, -3.0, -0.75]

      # --- 행동 전환 (Lv1 기준. 수색은 Lv1에 없으므로 search_hold_s=0) ---
      # 펌킨까지의 거리는 의심 시작 조건이 아니다: 거리와 상관없이 유효한 관측이 오면 바로 의심(SUSPECT)을 시작한다
      # (개발팀장 구두 지시 2026-10-11. 몇 m까지 인지되는지는 탐지 노드가 정한다).
      suspicion_fill_s: 3.0        # 계속 보일 때 의심 게이지 0 → 1 [s] (SRD 부록 A Lv1). 계속 보이면 의심 모드는 이 시간(3초)이고,
                                   # 게이지가 1이 되면 추격(CHASE)을 시작한다
      suspicion_decay_s: 3.0       # 안 보일 때 게이지 1 → 0 [s]. 0이 되면 의심을 거두고 순찰로 돌아간다
      lost_timeout_s: 1.0          # 추격 중 이 시간[s] 동안 관측이 없으면 놓친 것으로 보고 마지막 목격 위치를 수색한다
      search_hold_s: 0.0           # 수색 지점에 도착한 뒤 머무는 시간 [s]. 0이면 도착 즉시 순찰로 돌아간다
      search_timeout_s: 15.0       # 수색 지점까지 가는 데 쓸 최대 시간 [s]. 넘으면 못 간 채로 수색을 끝낸다
      max_goal_failures: 3         # 순찰 목표가 연속으로 이만큼 실패하면 멈추고 사유를 남긴다 [회]
      failure_hold_s: 5.0          # 연속 실패로 멈춘 뒤 이 시간[s]이 지나면 실패 횟수를 지우고 다시 시도한다
      suspect_hold: true           # 의심 중 이동을 멈추고 서서 관찰한다. false이면 의심 중에도 순찰을 계속한다
